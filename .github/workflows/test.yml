name: Test

# Runs the gem's RSpec suite on every PR targeting main, so a failing test
# blocks merge instead of only being caught by CircleCI after the fact.
#
# No services are provisioned: spec/test_app/config/database.yml is
# sqlite3-only and spec/test_app/db/schema.rb defines no tables (this gem
# ships no ActiveRecord models), and nothing in the app or spec suite
# references Redis, so the Postgres and Redis containers CircleCI's job
# starts are both unused here.

on:
  pull_request:
    branches:
      - main

env:
  RAILS_ENV: test
  DISABLE_SPRING: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    # The gemspec allows Rails >= 7.2, < 8.2 (NFG-4789 / NFG-4201 decision D2), so the
    # suite runs once per supported Rails series. The root Gemfile is the 8.1 leg;
    # gemfiles/rails_7_2.gemfile pins the 7.2 series. Each has its own committed lockfile
    # so bundler-cache keys on the right one.
    strategy:
      fail-fast: false
      matrix:
        gemfile:
          - Gemfile
          - gemfiles/rails_7_2.gemfile

    name: test (${{ matrix.gemfile }})

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.2'
          bundler-cache: true

      - name: Check install
        # ubuntu-latest ships Chrome preinstalled. spec/rails_helper.rb runs it
        # headless, and Selenium Manager (selenium-webdriver >= 4.11) fetches a
        # matching chromedriver at run time, so no display server or driver
        # install step is needed; this just logs the browser version.
        run: google-chrome --version

      - name: Run test suite
        run: |
          mkdir -p tmp/test-results
          bundle exec rspec --format progress \
                            --format RspecJunitFormatter \
                            --out tmp/test-results/rspec.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-results-${{ strategy.job-index }}
          path: tmp/test-results
